name: Recover missed pull request reviews

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: hedgehog-pr-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Create a short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: gregnazario
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-checks: write

      - name: Install Pi
        run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.84.4

      - name: Review new PR commits
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PI_MODELS: ${{ vars.PI_MODELS || 'zai/glm-5.3:high' }}
          PR_AUTHOR: gregnazario
          BOT_LOGIN: ${{ vars.BOT_LOGIN || 'hedgehog-pr-bot' }}
          MAX_REVIEWS_PER_RUN: "5"
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
          NO_COLOR: "1"
        run: node scripts/review-prs.ts
