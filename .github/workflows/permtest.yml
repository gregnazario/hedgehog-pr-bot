name: PR permission self-test

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create a throwaway PR with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          BRANCH="chore/permtest-${{ github.run_id }}"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit --allow-empty -m "PR permission self-test (auto-closed)"
          git push origin "$BRANCH"
          gh pr create \
            --title "Actions PR-permission self-test (auto-closed)" \
            --body "Temporary verification of the Actions PR-creation setting; will be closed immediately." \
            --head "$BRANCH"
