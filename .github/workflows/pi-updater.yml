name: Pi version check

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pi-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open an update PR when a newer Pi release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The npm registry is authoritative for the installed package version.
          LATEST=$(curl -sf https://registry.npmjs.org/@earendil-works/pi-coding-agent/latest \
            | jq -r .version)
          CURRENT=$(grep -oP 'ARG PI_VERSION=\K[0-9.]+' Dockerfile)
          echo "latest=$LATEST current=$CURRENT"
          if ! printf '%s' "$LATEST" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not determine the latest Pi version; skipping."
            exit 0
          fi
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Pi pin is up to date."
            exit 0
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          BRANCH="chore/pi-${LATEST}"
          git checkout -b "$BRANCH"
          sed -i "s/$CURRENT/$LATEST/g" Dockerfile README.md
          git commit -am "Update Pi to $LATEST"
          git push origin "$BRANCH"
          gh pr create \
            --title "Update Pi to $LATEST" \
            --body "Automated weekly check: the latest \`@earendil-works/pi-coding-agent\` release is \`$LATEST\` (was \`$CURRENT\`). Updates the Dockerfile pin and the README default. **Before merging:** also bump the \`npm install\` step in \`.github/workflows/review.yml\` — pushes from Actions cannot modify workflow files." \
            || if gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq 'length' | grep -q '^1$'; then
                 echo "Update PR already open."
               else
                 echo "::warning::Could not open the update PR — check that Actions may create pull requests (Settings → Actions → General)."
                 exit 1
               fi
