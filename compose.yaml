services:
  hedgehog-pr-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional automatic TLS: docker compose --profile tls up -d
  # with DOMAIN=pr.example.com in .env
  caddy:
    profiles: ["tls"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN when using the tls profile}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hedgehog-pr-bot

volumes:
  caddy_data:
  caddy_config:
